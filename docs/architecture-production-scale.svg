    <text x="1235" y="682" text-anchor="middle" class="s">Event platform</text><text x="1235" y="712" text-anchor="middle" class="b">Kafka · workers</text><text x="1235" y="736" text-anchor="middle" class="b">Payments · analytics</text>
  </g>
